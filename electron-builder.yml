appId: com.hentaifigure.app
productName: HentaiFigure
copyright: HentaiFigure
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - app-config.json
  - package.json
  - "!**/*.map"
asar: true
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: HentaiFigure-${version}-portable.exe


